<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>


        *{
            box-sizing: border-box;
            font-family: sans-serif;
        } 
        

        /* TABLA */

        table{
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            text-align: center;
            
            & tr td{
                width: 100%;
                border: 3px solid blue;
                padding: 5px;
            }

        }


        /* DIV */

        .table{
            width: 100%;
            & .tr{
                height:48px;
            }
        }




    </style>
</head>
<body>
    <main>
        <h2>TABLAS CON table</h2>

         <table>
        <tr>
            <td colspan="2">1</td>
            <td colspan="2">1</td>
            <td colspan="4">1</td>
        </tr>
        <tr>
            <td colspan="4">2</td>
            <td colspan="4">2</td>
        </tr>
        <tr>
            <td colspan="3">3</td>
            <td colspan="4">3</td>
            <td >3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>4</td>
            <td colspan="2">4</td>
            <td colspan="3">4</td>
            <td>4</td>
        </tr>
    </table>

    <hr>
 
    <h2>TABLAS CON div</h2>
    <div class="table">
        <div class="tr">
            <div class="td">1</div>
            <div class="td">11</div>
            <div class="td">111</div>
            <div class="td">1111</div>
        </div>
        <div class="tr">
            <td>2</td>
            <td>222222</td>
            <td>2222222222</td>
        </div>
        <div class="tr">
            <div class="td">3</div>
            <div class="td">33</div>
            <div class="td">333</div>
            <div class="td">3333</div>
            <div class="td">33333</div>
            <div class="td">33333</div>
            <div class="td">3333</div>
            <div class="td">333</div>
            <div class="td">33</div>
            <div class="td">3</div>
        </div>
        <div class="tr">
            <div class="td">4.1</div>
            <div class="td">4.2</div>
            <div class="td">4.3</div>
            <div class="td">4.4</div>
            <div class="td">4.5</div>
        </div>
         <div class="tr">
            <div class="td">5.1</div>
            <div class="td">5.2</div>
            <div class="td">5.3</div>
            <div class="td">5.4</div>
            <div class="td">5.5</div>
        </div>
 
    </div>
    </main>

</body>
</html>
