<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>


        *{
            box-sizing: border-box;
            font-family: sans-serif;
        } 
        

        /* TABLA */

        table{
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            text-align: center;
            margin-bottom: 20px;
            
            & tr td{
                width: 100%;
                border: 3px solid blue;
                padding: 5px;
            }

        }


        /* DIV */

        .table{
            width: 100%;

            & .tr{
                height:40px;
                font-size: 0;

                 &:first-of-type{ 
                    border-top: 2px solid green;
                    } 

            }

            & .td{
                display:inline-block;
                border: 2px solid green;
                font-size: 16px;
                height: 100%;
                border-right: 0px;
                border-top: 0px; 

                    &:last-child{
                    border-right: 2px solid green;

                    
                }
            }

            & .tr:nth-of-type(1) .td{
                width: 25%;
            }

            & .tr:nth-of-type(2) .td{
                width: 33.33%;
            }

            & .tr:nth-of-type(3) .td{   
                text-align: center;             
                width: 10%;

                &:nth-of-type(5){
                    background-color: blueviolet;
                    color: white;
                }

                &:nth-of-type(5),&:nth-of-type(6){
                    vertical-align: top;
                    line-height: 40px;
                }
            }

            & .tr:nth-of-type(4) .td{
                width: 20%;
            }

            & .tr:nth-of-type(5) .td{
                width: 20%;
            }

        }




    </style>
</head>
<body>
    <main>
        <h2>TABLAS CON table</h2>

         <table>
        <tr>
            <td colspan="2">1</td>
            <td colspan="2">1</td>
            <td colspan="4">1</td>
        </tr>
        <tr>
            <td colspan="4">2</td>
            <td colspan="4">2</td>
        </tr>
        <tr>
            <td colspan="3">3</td>
            <td colspan="4">3</td>
            <td >3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>4</td>
            <td colspan="2">4</td>
            <td colspan="3">4</td>
            <td>4</td>
        </tr>
    </table>

    <hr>
 
    <h2>TABLAS CON div</h2>
    <div class="table">
        <div class="tr">
            <div class="td">1</div>
            <div class="td">11</div>
            <div class="td">111</div>
            <div class="td">1111</div>
        </div>
        <div class="tr">
            <div class="td">2</div>
            <div class="td">222222</div>
            <div class="td">2222222222</div>
        </div>
        <div class="tr">
            <div class="td">3</div>
            <div class="td">33</div>
            <div class="td">333</div>
            <div class="td">3333</div>
            <div class="td central">33333</div>
            <div class="td central">33333</div>
            <div class="td">3333</div>
            <div class="td">333</div>
            <div class="td">33</div>
            <div class="td">3</div>
        </div>
        <div class="tr">
            <div class="td">4.1</div>
            <div class="td">4.2</div>
            <div class="td">4.3</div>
            <div class="td">4.4</div>
            <div class="td">4.5</div>
        </div>
         <div class="tr">
            <div class="td">5.1</div>
            <div class="td">5.2</div>
            <div class="td">5.3</div>
            <div class="td">5.4</div>
            <div class="td">5.5</div>
        </div>
 
    </div>
    </main>

</body>
</html>
