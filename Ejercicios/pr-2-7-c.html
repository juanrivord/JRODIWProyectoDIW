<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;font-family: serif;
        font-weight: 600;
      }
      body {
        margin: 5px;
      }
      .container {
        width: 95%;
        height: 100vh;
        background-color: #34495e;
        border: 0.5px solid transparent;
        padding: 2px;
        overflow: hidden;
      }

      header {
        position: relative;
        width: 100%;
        height: 72px;
        background-color: #297777;
        border: 1px solid white;
        
        input{
          display:none;

          &:checked ~ nav{
            left:0;
          }
        }

        & .hbger {
          display: block;
          background-color: #666666;
          width: 52px;
          height: 48px;
          margin: 9px 0px 0px 10px;
          padding-top: 10px;
          border-radius: 5px;
          cursor: pointer;

          & span {
            display: block;
            width: 44px;
            height: 5px;
            background: white;
            margin: auto;
            box-shadow:
              0px 11px 0px white,
              0px 22px 0px white;
          } /* SPAN */

        } /* HBGER */

        nav{
          position: absolute;
          width: 200px;height: 90vh;
          background: #5c867a;
          top:72px;
          left: -100%;
          transition: left 0.5s ease-in-out;

            a{
              display: block;
              width: 100%;height: 48px;
              color: white;
              border-bottom: 1px solid white;
              text-decoration: none;
              padding-left: 10px;
              line-height: 40px;

              &:hover{
                background: #EE82EE;
              }
              
            } /* A */

        } /* NAV */

      } /* HEADER */
    </style>
  </head>
  <body>
    <div class="container">
      <header>

        <input type="checkbox" name="openNav" id="openNav">
        <label for="openNav" class="hbger">
          <span></span>
        </label>

        <nav>
          <a href="#">Inicio</a>
          <a href="#">Alumnos</a>
          <a href="#">Secretaria</a>
          <a href="#">Profesorado</a>
        </nav>

      </header>
    </div>
  </body>
</html>
