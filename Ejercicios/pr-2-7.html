<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2-7</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body{
            margin: 10px;
        }

        main{
            position: relative;
        }

        a{
            display: inline-block;
            text-align: center;
            height: 40px;width: 112px;
            line-height: 40px;
            border-radius: 6px 6px 0px 0px;
            text-decoration: none;
            font-family: serif;
            margin-left:24px;

            &:nth-of-type(1){background: #67E767;}
            &:nth-of-type(2){background: #5178E4;}
            &:nth-of-type(3){background: #EBB7D9;}

            
        }
        
        article{
            position:absolute;
            height: 300px;width: 450px;

            &:nth-of-type(1){background: #67E767;z-index: 1;}
            &:nth-of-type(2){background: #5178E4;z-index: 1;}
            &:nth-of-type(3){background: #EBB7D9;z-index: 1;}

        }

        article:target{z-index: 100;}
       
    </style>
</head>
 
<body>
    <main>
        <a href="#p1">Primera</a>
        <a href="#p2">Segunda</a>
        <a href="#p3">Tercera</a>
        <article id="p1">Contenido de la 1 PESTAÑA</article>
        <article id="p2">Contenido de la 2 PESTAÑA</article>
        <article id="p3">Contenido de la 3 PESTAÑA</article>
    </main>
</body>
 
</html>
