<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;font-family: serif;
        font-weight: 600;
      }

      .container {
        width: 100%;
        height: 100vh;
        background-color: #34495e;
      }

      header {
        position: relative;
        width: 100%;
        padding:10px;
        background: #000;
        
        input{
          display:none;
          &:checked ~ nav{
            left:0;
          }
        }

        & .hbger {
          display: block;
          background-color: #666666;
          width: 104px;
          height: 48px;
          margin: 0px 0px 0px 0px;
          padding-top: 10px;
          border-radius: 3px;

          &:hover{
            cursor: pointer;
            border: 2px solid white;
          }
          

          & span {
            display: block;
            width: 44px;
            height: 5px;
            background: white;
            margin-left: 5px;
            box-shadow:
              0px 11px 0px white,
              0px 22px 0px white;
          } /* SPAN */

          strong{
            display: inline-block;
            position: relative;
            left: 60px;
          }

        } /* HBGER */

        nav{
          position: absolute;
          width: 300px;height: 90vh;
          background: #FFFFFF;
          left: -100%;
          transition: left 0.5s ease-in-out;

            a{
              display: block;
              width: 100%;height: 48px;
              text-decoration: none;
              color:#232F3E;
              padding-left: 10px;
              line-height: 40px;

              &:hover{background: #EE82EE;}

              &:nth-of-type(1){
                background: #232F3E;
                color: white;
              }
              
            } /* A */

        } /* NAV */

      } /* HEADER */
    </style>
  </head>
  <body>
    <div class="container">
      <header>

        <input type="radio" name="rd" id="openNav">
        <input type="radio" name="rd" id="closeNav">
        <label for="openNav" class="hbger">
          <span></span>
          <strong>Todo</strong>
        </label>

        <nav>
          <a href="#">Hola, identificate</a>
          <a href="#">Tendencias</a>
          <a href="#">Los mas vendidos</a>
          <a href="#">Ultimas novedades</a>
          <a href="#">Vender en amazon</a>
          <a href="#">Contenido de amazon</a>
          <a href="#">Amazon Prime Video</a>
          <a href="#">Amazon Music</a>
          <a href="#">Amazon Photos</a>
        </nav>
        <label for="closeNav"></label>

      </header>
    </div>
  </body>
</html>
