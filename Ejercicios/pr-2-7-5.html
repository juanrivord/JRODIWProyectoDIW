<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica 2.7.5</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-weight: bold;
      }

      body{margin: 5px;}

      .container{
        width: 100%;height: auto;
        background-color: #9B9669;
      }

      ul{
        list-style: none;
      }

      li{
        position: relative;
        height: inherit;width: 25%;
      }

      a{
        display: block;
        width: 100%;height: 100%;
        text-decoration: none;
        text-align: center;
        line-height: 52px;

        &:hover{
            background-color: #D2D2D2;
        }
      }

      .menu{
        position: relative;
        width: 100%;height: 52px;
        font-size: 0;

        & > li{
            display:inline-block;
            font-size: 1rem;
            background: #AAB9C8;
            border-right: 0.5px solid grey;
            
        }

      }

      .sub-menu1, .sub-menu2{
        width: 100%;
        display: none;
      }

      .sub-menu1{
        position: absolute;
        top: 52px;
      }


    </style>
  </head>

  <body>
    <div class="container">

        <ul class="menu">
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Oficina</a></li>
          <li>
            <a href="#">Instituto&nbsp; &#x25BC;</a>

            <ul class="sub-menu1">

              <li><a href="#">Fisica-Química</a></li>
              <li><a href="#">Inglés</a></li>

              <li>
                <a href="#">Matemáticas&nbsp; &#x25BA;</a>

                <ul class="sub-menu2">
                  <li><a href="#">Académicas</a></li>
                  <li><a href="#">Aplicadas</a></li>
                </ul>

              </li>

            </ul>

          </li>
          <li><a href="#">Alumnos</a></li>
        </ul>

    </div>
  </body>
</html>
