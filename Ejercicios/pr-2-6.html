<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2-6</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body{
            margin: 10px;
            font-weight: bold;
            font-size: 2rem;
        }

        main{
            width: 600px;
            height: 600px;
            background: grey;
            position: relative;
            top: 40%;
        }

        article:nth-of-type(n):nth-of-type(-n+4){
            position: absolute;
            padding:15px;
        }

        article:nth-of-type(1){
            width: 325px;
            height: 400px;
            background: #ef476f;
            right: 0;
            text-align: right;
            z-index: 3;
        }

        article:nth-of-type(2){
            width: 200px;
            height: 200px;
            background: #ffd166;
            bottom: 200px;left:200px;
            text-align: center;
            z-index: 4;
        }

        article:nth-of-type(3){
            width: 325px;
            height: 400px;
            background: #118ab2;
            bottom: 0;right: 0;
            z-index: 2;
        }

        article:nth-of-type(4){
            width: 275px;
            height: 400px;
            background: #8b5bd3;
            bottom: 0;
            z-index: 1;
        }

        article:nth-of-type(5){
            width: 275px;
            height: 400px;
            background: #06D6A0;
            padding:15px;
        }

        article:hover{
            z-index: 100;
        }
 
    </style>
</head>
 
<body>
    <main>
        <article>1</article>
        <article>2</article>
        <article>3</article>
        <article>4</article>
        <article>5</article>
    </main>
</body>
 
</html>
