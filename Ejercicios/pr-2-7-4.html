
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2.7.4</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 0% 0%,
                yellow 0%,
                blue 100%
            );
        }

        .container::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            box-shadow: inset -15px -15px 25px rgba(0, 0, 0, 0.4);
        }

        .container::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 30px;
            left: 45%;
            bottom: -12px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, blue 40%, rgba(0, 0, 255, 0.6) 70%, transparent 100%);
            filter: blur(5px);
            z-index: -1;
        }
    </style>
</head>

<body>
    <div class="container"></div>
</body>

</html>
