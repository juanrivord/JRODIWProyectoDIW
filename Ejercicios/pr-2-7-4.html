
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2.7.4</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 0% 0%,
                yellow 0%,
                blue 100%
            );
            margin-bottom: 50px;
        }

        .container::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            box-shadow: inset -15px -15px 25px rgba(0, 0, 0, 0.4);
        }

        .container::after {
            content: "";
            position: absolute;
            width: 250px;
            height: 30px;
            left: 45%;
            bottom: -12px;
            border-radius: 50%;
            opacity: 0.5;
            background: radial-gradient(ellipse at center, blue 60%, rgba(0, 0, 255, 0.5) 70%, transparent 100%);
            filter: blur(5px);
            z-index: -1;
        }




        .wrapper{
            width: 500px;height: 400px;
        }

        h2{
            margin-bottom: 50px;
        }

        .caja{
            position: relative;
            width: 300px;height: 75px;
            background: #444444;
            border-radius: 10px;
            color: white;
            line-height: 75px;
            padding-left: 20px;
            font-size: 2rem;
            margin-left: 20px;

            &::before{
                content: "";
                position: absolute;
                display: block;
                width: 0px;height: 0px;
                border: 25px solid transparent; /* Para hacer todos en vez de uno por uno transparente */
                /* border-top: 25px solid red;
                border-left: 25px solid yellow;
                border-right: 25px solid green; */
                border-bottom: 25px solid blue;
                left: 220px;
                top:-50px
            }

            &::after{
                content: "";
                position: absolute;
                display: block;
                width: 0px;height: 0px;
                border: 25px solid transparent; 
                border-top: 25px solid rgb(82, 82, 255);
                left: 40px;
                bottom:-50px;
            }
        }




    </style>
</head>

<body>
    
    <div class="container"></div>

    <h2>Cajas con triangulo de señalizacion</h2>
    <div class="wrapper">
        <div class="caja">
            A
        </div>
    </div>
</body>

</html>
